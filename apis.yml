aid: dimension
name: Dimension
description: Dimension is a nationwide, on-demand waste management and junk removal
  platform (formerly Trash Warrior) backed by 500 Global. It offers digital booking
  with instant AI-generated pricing (their "Mirror Mirror AI" quoter), same-day and
  next-day pickup for cardboard, appliances, mattresses, hazardous and medical waste,
  plus dumpster rentals, for both businesses and individuals. Every job includes
  tracking with detailed diversion data, receipts, and photos, and can be booked as
  a one-off or recurring service. Dimension has been awarded a State of California
  RFP contract for PPE waste removal. The company operates a customer-facing booking
  application and help center but does not currently publish a public developer API,
  SDKs, or developer documentation.
